*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 20% 0,#222a39 0,#090b10 38%,#050608 72%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;padding-bottom:90px}.shell{max-width:1240px;margin:auto;padding:18px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,8,11,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}
.topbar-inner{max-width:1240px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-logo{width:46px;height:46px;border-radius:14px;background:#fff var(--forge-logo) center/86% auto no-repeat;border:1px solid rgba(216,184,90,.45);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.brand-text strong{display:block;font-size:16px;letter-spacing:.02em}.brand-text span{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}
.net{font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.net.off{color:#ffd08a;border-color:#6b4f24;background:#2a1d0b}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;background:var(--gold);color:#151515;box-shadow:none}.btn:hover{filter:brightness(1.04)}
.btn.secondary{background:#202633;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.success{background:var(--green);color:#071008}.btn.danger{background:var(--red);color:#fff}.btn.small{padding:8px 10px;border-radius:10px;font-size:13px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:10px 0 18px}.page-head h1{font-size:clamp(24px,4vw,38px);margin:0}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}
.subtitle{color:var(--muted);margin-top:7px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.kpi{padding:18px}.kpi strong{font-size:30px;color:var(--gold2);display:block}.kpi span{font-size:13px;color:var(--muted)}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.hero-action{min-height:175px;position:relative;overflow:hidden;border:1px solid rgba(216,184,90,.25);border-radius:26px;padding:22px;background:linear-gradient(145deg,#151a24,#0b0d12);color:white;text-align:left}
.hero-action:after{content:"FORGE";position:absolute;right:-7px;bottom:-13px;font-size:64px;font-weight:1000;color:rgba(255,255,255,.028)}.hero-action h2{font-size:24px;margin:0 0 8px}.hero-action p{color:#c3cad7;max-width:420px;line-height:1.45}.hero-action .cta{display:inline-flex;margin-top:13px;color:var(--gold2);font-weight:900}
.list{display:flex;flex-direction:column;gap:10px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#0c0f15}.list-main{min-width:0}.list-main strong{display:block}.list-main small{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;background:#090b10;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,184,90,.12)}.field textarea{min-height:86px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.good{color:#8ef3a7;border-color:#2d6840;background:#0e2416}.chip.bad{color:#ff9999;border-color:#6a2e2e;background:#281010}.chip.warn{color:#ffd27f;border-color:#6f5424;background:#2b210c}.chip.info{color:#a9c8ff;border-color:#335b93;background:#10213a}
.progress{height:9px;background:#0a0d12;border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}
.section-tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px;scrollbar-width:none}.section-tabs button{white-space:nowrap;border:1px solid var(--line);background:#121722;color:var(--muted);padding:9px 11px;border-radius:999px}.section-tabs button.active{background:rgba(216,184,90,.13);border-color:rgba(216,184,90,.55);color:var(--gold2)}

const Utils={
 id:()=>crypto.randomUUID?crypto.randomUUID():("id-"+Date.now()+"-"+Math.random().toString(16).slice(2)),
 now:()=>new Date().toISOString(),
 dateFR:(v)=>v?new Date(v).toLocaleDateString("fr-FR"):"—",
 dateTimeFR:(v)=>v?new Date(v).toLocaleString("fr-FR"):"—",
 esc:(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),
 clamp:(n,min,max)=>Math.max(min,Math.min(max,n)),
 windDirection:(deg)=>{const n=Number(deg);if(!Number.isFinite(n))return "—";return WIND_DIRECTIONS[Math.round(((n%360)+360)%360/45)%8]},
 addYears:(date,years=1)=>{const d=new Date(date);if(Number.isNaN(d.getTime()))return null;const x=new Date(d);x.setFullYear(x.getFullYear()+years);return x},
 daysBetween:(a,b)=>Math.ceil((new Date(b)-new Date(a))/86400000),
 groupHours:(hours)=>{if(!hours?.length)return [];const nums=[...new Set(hours.map(Number).filter(Number.isFinite))].sort((a,b)=>a-b),out=[];let s=nums[0],p=nums[0];for(const h of nums.slice(1)){if(h===p+1){p=h;continue}out.push(s===p?`${String(s).padStart(2,"0")}h`:`${String(s).padStart(2,"0")}h–${String(p).padStart(2,"0")}h`);s=p=h}out.push(s===p?`${String(s).padStart(2,"0")}h`:`${String(s).padStart(2,"0")}h–${String(p).padStart(2,"0")}h`);return out},
 debounce:(fn,wait=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}},
 fileToDataURL:(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)}),
 async compressImage(file,maxW=1600,quality=.78){
   const url=await Utils.fileToDataURL(file); const img=new Image(); await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
   let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
   const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
   return c.toDataURL("image/jpeg",quality);
 }
};

const Calculations={
 areaShape(sh){const h=parseFloat(sh.h)||0,w=parseFloat(sh.w)||0;return sh.type==="triangle"?(h*w/2):(h*w)},
 windTotals(inspection){
   const shapes=inspection.windShapes||{recto:[],verso:[],gauche:[],droite:[]},faces={};
   ["recto","verso","gauche","droite"].forEach(f=>faces[f]=(shapes[f]||[]).reduce((a,s)=>a+Calculations.areaShape(s),0));
   const total=Object.values(faces).reduce((a,b)=>a+b,0);
   return {faces,total,anchors:total>0?Math.ceil(total/NORM_RULES.anchorAreaPerPoint.value):0};
 },
 userTotals(inspection){
   const gross=(inspection.userShapes||[]).reduce((a,s)=>a+Calculations.areaShape(s),0);
   const deductions=(inspection.userDeductions||[]).reduce((a,s)=>a+Calculations.areaShape(s),0);
   const net=Math.max(0,gross-deductions);
   const base={m100:Math.floor(net/1),m120:Math.floor(net/1.33),m150:Math.floor(net/1.66),m180:Math.floor(net/2)};
   const slides=(inspection.userSlides||[]).reduce((a,s)=>a+(parseInt(s.capacity)||0),0);
   return {gross,deductions,net,base,slides,total:{m100:base.m100+slides,m120:base.m120+slides,m150:base.m150+slides,m180:base.m180+slides}};
 },
 selfTest(){
   const a=Calculations.areaShape({type:"rectangle",h:2,w:3})===6;
   const b=Calculations.areaShape({type:"triangle",h:2,w:3})===3;
   const i={windShapes:{recto:[{type:"rectangle",h:3,w:3}],verso:[{type:"rectangle",h:3,w:3}],gauche:[],droite:[]},userShapes:[],userDeductions:[],userSlides:[]};
   const c=Calculations.windTotals(i).anchors===2;
   return a&&b&&c;
 }
};

const DB={
 name:"forge-certification-v4",version:1,db:null,
 stores:["loueurs","structures","campaigns","inspections","installations","settings","audit"],
 open(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB.name,DB.version);r.onupgradeneeded=e=>{const d=e.target.result;DB.stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})})};r.onsuccess=()=>{DB.db=r.result;resolve()};r.onerror=()=>reject(r.error)})},
 tx(store,mode="readonly"){return DB.db.transaction(store,mode).objectStore(store)},
 getAll(store){return new Promise((res,rej)=>{const r=DB.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
 get(store,id){return new Promise((res,rej)=>{const r=DB.tx(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})},
 put(store,obj){return new Promise((res,rej)=>{obj.updatedAt=Utils.now();if(!obj.createdAt)obj.createdAt=obj.updatedAt;if(store!=="settings"&&!obj.organizationId)obj.organizationId=App.settings?.organization?.id||"local-org";obj.revision=(Number(obj.revision)||0)+1;obj.syncStatus="local";const r=DB.tx(store,"readwrite").put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})},
 del(store,id){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
};

const API={
 async companyBySiret(siret){
   if(!CONFIG.api.companyLookup)throw new Error("API désactivée");
   const clean=String(siret).replace(/\D/g,""); if(clean.length!==14)throw new Error("SIRET invalide");
   const r=await fetch(CONFIG.endpoints.company+"?q="+encodeURIComponent(clean)+"&limit=5");
   if(!r.ok)throw new Error("Service entreprise indisponible");
   const j=await r.json(), results=j.results||[];
   let item=results.find(x=>(x.siege?.siret||"")===clean)||results.find(x=>(x.matching_etablissements||[]).some(e=>e.siret===clean))||results[0];
   if(!item)throw new Error("Entreprise introuvable");
   const et=(item.matching_etablissements||[]).find(e=>e.siret===clean)||item.siege||{};
   const address=et.adresse||item.siege?.adresse||"";
   return {name:item.nom_complet||item.nom_raison_sociale||"",siren:item.siren||clean.slice(0,9),siret:clean,address,postalCode:et.code_postal||item.siege?.code_postal||"",city:et.libelle_commune||item.siege?.libelle_commune||"",status:item.etat_administratif||""}
 },
 async geocode(q,limit=5){
   if(!CONFIG.api.addressSearch||!q||q.trim().length<3)return [];
   const u=CONFIG.endpoints.geocode+"?q="+encodeURIComponent(q)+"&limit="+limit+"&autocomplete=true&index=address";
   const r=await fetch(u);if(!r.ok)throw new Error("Géocodage indisponible");
   const j=await r.json();return (j.features||[]).map(f=>({label:f.properties?.label||f.properties?.name||q,city:f.properties?.city||f.properties?.citycode||"",postalCode:f.properties?.postcode||"",lat:f.geometry?.coordinates?.[1],lon:f.geometry?.coordinates?.[0]}))

const Validation={
 inspection(i){
   const errors=[];const keys=Object.entries(CONTROL_CATEGORIES).flatMap(([c,a])=>a.map(x=>c+"|"+x));
   if(keys.some(k=>!i.answers?.[k]))errors.push("Tous les points de contrôle doivent être renseignés ou marqués N/A.");
   const fails=keys.filter(k=>i.answers?.[k]==="fail"&&!k.startsWith("CERTIFICATS|"));
   fails.forEach(k=>{if(!(i.notes?.[k]||"").trim())errors.push("Observation obligatoire pour : "+k.split("|")[1])});
   return {errors}
 },
 installation(i){
   const e=[];if(!i.loueurId)e.push("Loueur manquant.");if(!i.date)e.push("Date manquante.");if(!(i.location||i.address))e.push("Lieu/adresse manquant.");if(!(i.structureIds||[]).length)e.push("Aucune structure.");
   if(i.outdoor&&!(i.weather?.fieldWind||i.weather?.api))e.push("Météo extérieure non renseignée.");if(INSTRUCTIONS.some(x=>!i.instructions?.[x]))e.push("Toutes les consignes doivent être confirmées.");
   if(!i.responsible?.name)e.push("Personne responsable non renseignée.");if(!i.signatureData)e.push("Signature du responsable sur site manquante.");return {errors:e}
 }
};

const Install={
 isClosed(i){return ["completed","closed","clôturée","cloturee","terminée","terminee"].includes(String(i?.status||"").toLowerCase())},
 auditEntries(i){
   const entries=Array.isArray(i?.auditTrail)?[...i.auditTrail]:[];
   if(i?.closedAt&&!entries.some(e=>e.type==="installation_completed"))entries.push({id:"legacy-close",type:"installation_completed",at:i.closedAt,revision:i.revision||1,legacy:true});
   return entries.sort((a,b)=>new Date(a.at||0)-new Date(b.at||0));
 },
 auditHtml(i){
   const entries=Install.auditEntries(i),closed=Install.isClosed(i);

   return `<div class="readonly-note"><div class="row" style="justify-content:space-between"><div><div class="lock-badge">${closed?"🔒 Installation clôturée — lecture seule":"📝 Installation réouverte — modification tracée"}</div><div class="audit-note">Révision actuelle : ${Utils.esc(i.revision||1)} · historique conservé localement et prévu pour <code>audit_logs</code> dans Supabase.</div></div></div><details style="margin-top:.65rem" ${closed?"":"open"}><summary><b>Historique / traçabilité (${entries.length})</b></summary><div class="list" style="margin-top:.55rem">${rows||'<div class="muted small">Aucun événement enregistré.</div>'}</div></details></div>`
 },
 applyReadOnly(){
   const root=document.getElementById("main");if(!root)return;

 },

 signatureHtml(i){return `<div class="card"><h3>Personne responsable</h3><div class="two"><div class="field"><label>Nom et prénom</label><input id="respName" value="${Utils.esc(i.responsible?.name||"")}"></div><div class="field"><label>Téléphone</label><input id="respPhone" value="${Utils.esc(i.responsible?.phone||"")}"></div></div><div class="field"><label>Fonction / qualité</label><input id="respRole" value="${Utils.esc(i.responsible?.role||"")}"></div><div class="notice info">Je reconnais avoir reçu les consignes de sécurité, les procédures à suivre en cas d'affaissement et d'évacuation, les informations météorologiques utiles, les points de surveillance, les informations relatives au contrat et les informations relatives aux assurances / responsabilités applicables.</div><div class="field"><label>Signature tactile</label><div class="signature-wrap"><canvas id="responsableSignatureCanvas" width="900" height="260"></canvas></div></div>${i.signatureData?`<div class="sig-preview"><img src="${i.signatureData}"></div>`:""}<div class="row"><button class="btn ghost" onclick="Signature.clear('responsableSignatureCanvas')">Effacer</button><button class="btn success" onclick="Install.validateSignature()">Valider et terminer</button></div></div>`},

 async saveCurrent(silent=false){const i=await Install.current(),step=App.ctx.installStep;if(Install.isClosed(i)){if(!silent)alert("Cette installation est clôturée. Réouvrez-la avec un motif pour la modifier.");return false}if(step===1){i.date=Form.value("instDate")||i.date;i.time=Form.value("instTime")||i.time;i.location=Form.value("instLocation");i.address=Form.value("instAddress");i.lat=Form.value("instLat");i.lon=Form.value("instLon");i.outdoor=Form.checked("instOutdoor")}if(step===2){i.loueurId=Form.value("instLoueur")||i.loueurId;i.structureIds=[...document.querySelectorAll(".instStruct:checked")].map(x=>x.value)}if(step===4){i.weather=i.weather||{};i.weather.fieldWind=Form.value("fieldWind");i.weather.fieldWindDirection=Form.value("fieldWindDirection");i.weather.instrument=Form.value("fieldInstrument");i.weather.rain=Form.value("fieldRain");i.weather.vigilance=Form.value("fieldWeatherVigilance");i.weather.notes=Form.value("fieldWeatherNotes")}if(step===5){i.instructions=i.instructions||{};document.querySelectorAll(".instInstruction").forEach(x=>i.instructions[x.dataset.key]=x.checked);i.instructionNotes=Form.value("instructionNotes")}if(step===7){i.responsible={name:Form.value("respName"),phone:Form.value("respPhone"),role:Form.value("respRole")};const c=document.getElementById("responsableSignatureCanvas");if(c&&Signature.hasInk(c))i.signatureData=c.toDataURL("image/png")}await repository.installations.save(i);if(!silent)alert("Installation enregistrée sur cet appareil.");return true},
 async changeLoueur(id){const i=await Install.current();if(Install.isClosed(i))return alert("Installation clôturée : réouverture obligatoire pour modifier le loueur.");i.loueurId=id;i.structureIds=[];await repository.installations.save(i);Screens.installation()},
 async updateStructures(){const i=await Install.current();if(Install.isClosed(i))return alert("Installation clôturée : réouverture obligatoire pour modifier les structures.");i.structureIds=[...document.querySelectorAll(".instStruct:checked")].map(x=>x.value);await repository.installations.save(i)},
 async setStructField(id,k,v){const i=await Install.current();if(Install.isClosed(i))return;i.structureChecks=i.structureChecks||{};i.structureChecks[id]=i.structureChecks[id]||{checks:{}};i.structureChecks[id][k]=v;await repository.installations.save(i)},
 async setStructCheck(id,k,v){const i=await Install.current();if(Install.isClosed(i))return alert("Installation clôturée : réouverture obligatoire pour modifier un contrôle.");i.structureChecks=i.structureChecks||{};i.structureChecks[id]=i.structureChecks[id]||{checks:{}};i.structureChecks[id].checks=i.structureChecks[id].checks||{};i.structureChecks[id].checks[k]=v;await repository.installations.save(i);Screens.installation()},
 async fillStructureNames(){const ss=await repository.structures.all();document.querySelectorAll("[data-structname]").forEach(el=>{el.textContent=ss.find(s=>s.id===el.dataset.structname)?.name||"Structure"})},
 async useLocation(){if(!navigator.geolocation)return alert("Géolocalisation non disponible.");navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;document.getElementById("instLat").value=lat;document.getElementById("instLon").value=lon;try{const a=await API.reverse(lat,lon);document.getElementById("instAddress").value=a.label||""}catch(e){alert("Position obtenue, mais adresse non récupérée.")}},e=>alert("Localisation refusée ou indisponible : "+e.message),{enableHighAccuracy:true,timeout:12000})},
 async fetchWeather(){const current=await Install.current();if(Install.isClosed(current))return alert("Installation clôturée : la météo enregistrée fait partie du constat figé.");await Install.saveCurrent(true);const i=await Install.current();if(!i.lat||!i.lon)return alert("Utilisez la géolocalisation ou renseignez une adresse géocodée.");try{i.weather=i.weather||{};i.weather.api=await API.weather(i.lat,i.lon,i.date);await repository.installations.save(i);Screens.installation()}catch(e){alert(e.message+". La saisie terrain reste disponible.")}},
 async validateSignature(){const before=await Install.current();if(Install.isClosed(before))return alert("Cette installation est déjà clôturée.");await Install.saveCurrent(true);const i=await Install.current(),v=Validation.installation(i);if(v.errors.length)return alert(v.errors.join("\n"));const now=Utils.now(),nextRevision=(Number(i.revision)||0)+1;i.status="completed";i.closedAt=now;i.auditTrail=Array.isArray(i.auditTrail)?i.auditTrail:[];i.auditTrail.push({id:Utils.id(),type:"installation_completed",at:now,revision:nextRevision});i.snapshot={loueur:await repository.loueurs.get(i.loueurId),structures:(await repository.structures.all()).filter(s=>(i.structureIds||[]).includes(s.id)),organization:App.settings.organization,weather:i.weather,instructions:i.instructions,responsible:i.responsible,closedAt:now,revision:nextRevision};await repository.installations.save(i);await repository.audit.save({id:Utils.id(),type:"installation_completed",entityType:"installation",entityId:i.id,revision:i.revision,createdAt:now});App.ctx.installStep=8;Screens.installation()},
 async share(id){const i=await repository.installations.get(id),c=await repository.loueurs.get(i.loueurId),ss=(await repository.structures.all()).filter(s=>(i.structureIds||[]).includes(s.id));const text=`Bon de contrôle d'installation Forge Certification\n${Utils.dateFR(i.date)} · ${i.location||i.address||""}\nLoueur : ${c?.name||""}\nStructures : ${ss.map(s=>s.name).join(", ")}`;if(navigator.share){try{return await navigator.share({title:"Bon d'installation Forge Certification",text,url:location.href})}catch(e){if(e.name==="AbortError")return}}await navigator.clipboard?.writeText(text);alert("Résumé copié. Vous pouvez l'envoyer depuis votre application de messagerie.")},
 async email(id){const i=await repository.installations.get(id),c=await repository.loueurs.get(i.loueurId),ss=(await repository.structures.all()).filter(s=>(i.structureIds||[]).includes(s.id));const to=c?.email||"",subject=`Bon d'installation Forge Certification - ${i.location||Utils.dateFR(i.date)}`,body=`Bonjour,\n\nVeuillez trouver le bon de contrôle d'installation du ${Utils.dateFR(i.date)} pour ${i.location||i.address||"le site concerné"}.\nStructures : ${ss.map(s=>s.name).join(", ")}.\n\nLe PDF peut être joint après l'avoir enregistré depuis le bouton Imprimer / PDF.\n\nCordialement,\nForge Certification`;location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`},
 async report(id){const i=await repository.installations.get(id),loueur=await repository.loueurs.get(i.loueurId),all=await repository.structures.all(),ss=all.filter(s=>(i.structureIds||[]).includes(s.id)),o=App.settings.organization||{},threshold=Number(App.settings?.preferences?.weatherGustAlertKmh)||40;const structureRows=ss.map(s=>{const d=i.structureChecks?.[s.id]||{};return `<tr><td><b>${Utils.esc(s.name)}</b><br>${Utils.esc(s.serial||"")}</td><td>${Utils.esc(d.soil||"—")}${d.soilDetail?`<br>${Utils.esc(d.soilDetail)}`:""}</td><td>${Utils.esc(d.anchorType||"—")}<br>${Utils.esc(d.fixations||"—")} fixation(s)</td><td>${Utils.esc(d.ageRange||d.ageSize||"—")}<br>${Utils.esc(d.maxWeight||"—")} · ${Utils.esc(d.maxHeight||"—")}</td><td>${Utils.esc(d.notes||"")}</td></tr>`}).join("");const checkRows=ss.flatMap(s=>INSTALL_CHECKS.map(k=>`<tr><td>${Utils.esc(s.name)}</td><td>${Utils.esc(INSTALL_CHECK_LABELS[k]||k)}</td><td>${{pass:"OK",fail:"Défaut",na:"N/A"}[i.structureChecks?.[s.id]?.checks?.[k]]||"Non renseigné"}</td></tr>`)).join("");const alerts=(i.weather?.api?.day?.rows||[]).filter(r=>(Number(r.gusts)||0)>=threshold),alertHours=Utils.groupHours(alerts.map(r=>r.hour));App.screen="report";App.setHTML(`<div class="row end no-print" style="margin-bottom:12px"><button class="btn secondary" onclick="Install.open('${i.id}')">Retour</button><button class="btn secondary" data-closed-action="1" onclick="Install.share('${i.id}')">Partager</button><button class="btn secondary" data-closed-action="1" onclick="Install.email('${i.id}')">Préparer l'email</button><button class="btn" onclick="window.print()">Imprimer / enregistrer PDF</button></div><div class="report-wrap"><article class="report-page"><div class="wm"></div><div class="report-head"><div class="report-logo"></div><div class="report-title"><h1>Bon de contrôle d'installation</h1><div>Installation ponctuelle / location</div></div></div><div class="report-grid"><div class="report-box"><b>Loueur / propriétaire</b><br>${Utils.esc(loueur?.name||"—")}<br>${Utils.esc(loueur?.address||"")}</div><div class="report-box"><b>Lieu</b><br>${Utils.esc(i.location||"")}<br>${Utils.esc(i.address||"")}</div><div class="report-box"><b>Date</b><br>${Utils.dateFR(i.date)} · ${Utils.esc(i.time||"")}</div><div class="report-box"><b>Organisme</b><br>${Utils.esc(o.name||"Forge Certification")}<br>${Utils.esc(o.contact||"")}</div></div><h2>Structures installées</h2><table class="report-table"><thead><tr><th>Structure</th><th>Sol</th><th>Ancrage</th><th>Utilisateurs</th><th>Observations</th></tr></thead><tbody>${structureRows}</tbody></table><div class="report-footer"><span>Forge Certification</span><span class="rpii">RPII</span></div></article><article class="report-page"><div class="wm"></div><h2>Contrôle de l'installation</h2><table class="report-table"><thead><tr><th>Structure</th><th>Point vérifié</th><th>Résultat</th></tr></thead><tbody>${checkRows}</tbody></table><h2>Météo</h2><div class="report-box">${i.weather?.api?`Données indicatives ${Utils.esc(i.weather.api.source)} : vent ${i.weather.api.wind??"—"} km/h, rafales ${i.weather.api.gusts??"—"} km/h, direction ${Utils.esc(i.weather.api.directionLabel||Utils.windDirection(i.weather.api.direction))}.<br>Prévision journée : vent max ${i.weather.api.day?.maxWind??"—"} km/h, rafales max ${i.weather.api.day?.maxGust??"—"} km/h.${alertHours.length?`<br><b>Vigilance :</b> rafales ≥ ${threshold} km/h prévues ${Utils.esc(alertHours.join(", "))}.`:""}<br>`:""}Mesure terrain : vent ${Utils.esc(i.weather?.fieldWind||"—")} km/h · direction ${Utils.esc(i.weather?.fieldWindDirection||"—")} · instrument ${Utils.esc(i.weather?.instrument||"—")}<br>${i.weather?.vigilance?`Points de vigilance : ${Utils.esc(i.weather.vigilance)}<br>`:""}${Utils.esc(i.weather?.notes||"")}</div><div class="report-footer"><span>Forge Certification</span><span class="rpii">RPII</span></div></article><article class="report-page"><div class="wm"></div><h2>Consignes et remise au responsable</h2><table class="report-table"><tbody>${INSTRUCTIONS.map(x=>`<tr><td>${Utils.esc(x)}</td><td>${i.instructions?.[x]?"Confirmé":"Non confirmé"}</td></tr>`).join("")}</tbody></table><div class="report-box"><b>Personne responsable</b><br>${Utils.esc(i.responsible?.name||"—")}<br>${Utils.esc(i.responsible?.role||"")} ${i.responsible?.phone?"· "+Utils.esc(i.responsible.phone):""}</div>${i.signatureData?`<div class="report-box"><b>Signature</b><br><img src="${i.signatureData}" style="max-width:360px;max-height:160px"></div>`:""}<div class="report-box">Le responsable reconnaît avoir reçu les consignes de sécurité, procédures d'évacuation, informations contractuelles, informations relatives aux assurances / responsabilités et informations nécessaires à la surveillance de l'installation pendant toute la durée d'utilisation.</div><div class="report-footer"><span>Forge Certification</span><span class="rpii">RPII</span></div></article></div>`) }
};

const Signature={
 canvases:new Map(),
 init(id,onChange){
   const c=document.getElementById(id);if(!c)return;const ctx=c.getContext("2d");ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.lineCap="round";let drawing=false,ink=false;
   const pos=e=>{const p=e.touches?e.touches[0]:e;let left=0,top=0,node=c;while(node){left+=node.offsetLeft||0;top+=node.offsetTop||0;node=node.offsetParent}return{x:(p.pageX-left)*c.width/c.offsetWidth,y:(p.pageY-top)*c.height/c.offsetHeight}};
   const start=e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
   const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();ink=true;c.dataset.ink="1"};
   const end=e=>{if(!drawing)return;drawing=false;onChange?.(c.toDataURL("image/png"))};
   ["mousedown","touchstart"].forEach(x=>c.addEventListener(x,start,{passive:false}));["mousemove","touchmove"].forEach(x=>c.addEventListener(x,move,{passive:false}));["mouseup","mouseleave","touchend"].forEach(x=>c.addEventListener(x,end,{passive:false}));
 },
 clear(id){const c=document.getElementById(id);if(!c)return;c.getContext("2d").clearRect(0,0,c.width,c.height);c.dataset.ink=""},
 hasInk(c){return c.dataset.ink==="1"}
};

const Settings={
 async saveOrg(){App.settings.organization={id:App.settings.organization?.id||"local-org",name:Form.value("orgName"),address:Form.value("orgAddress"),siret:Form.value("orgSiret"),contact:Form.value("orgContact"),insurer:Form.value("orgInsurer"),insurance:Form.value("orgInsurance")};await repository.settings.save(App.settings);alert("Organisation enregistrée.")},
 async savePreferences(){App.settings.preferences=App.settings.preferences||{};App.settings.preferences.annualUpcomingDays=Math.max(1,parseInt(Form.value("prefUpcomingDays"))||30);App.settings.preferences.weatherGustAlertKmh=Math.max(1,parseFloat(Form.value("prefGustAlert"))||40);await repository.settings.save(App.settings);alert("Préférences enregistrées.")},
 async editInspector(id=null){const x=id?App.settings.inspectors.find(i=>i.id===id):{id:Utils.id(),name:"",cert:"",contact:"",roles:["CONTROLLER","INSTALLER"]};App.modal(`<div class="page-head"><div><h2>Contrôleur / installateur</h2></div><button class="btn ghost small" onclick="App.closeModal()">Fermer</button></div><input id="insId" type="hidden" value="${x.id}"><div class="field"><label>Nom</label><input id="insName" value="${Utils.esc(x.name)}"></div><div class="field"><label>Certification / RPII</label><input id="insCert" value="${Utils.esc(x.cert||"")}"></div><div class="field"><label>Contact</label><input id="insContact" value="${Utils.esc(x.contact||"")}"></div><div class="field"><label>Rôles</label><input id="insRoles" value="${Utils.esc((x.roles||[]).join(","))}"></div><div class="row end"><button class="btn success" onclick="Settings.saveInspector()">Enregistrer</button></div>`)},
 async saveInspector(){const x={id:Form.value("insId"),name:Form.value("insName"),cert:Form.value("insCert"),contact:Form.value("insContact"),roles:Form.value("insRoles").split(",").map(x=>x.trim()).filter(Boolean)};const idx=App.settings.inspectors.findIndex(i=>i.id===x.id);idx>=0?App.settings.inspectors[idx]=x:App.settings.inspectors.push(x);await repository.settings.save(App.settings);App.closeModal();Screens.settings()}
};
